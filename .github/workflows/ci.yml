name: IX-Sally CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality-gates:
    name: Python ${{ matrix.python-version }} quality gates
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python check_green.py --gate format

      - name: Lint
        run: python check_green.py --gate lint

      - name: Type check
        run: python check_green.py --gate type-check

      - name: Test
        run: python check_green.py --gate test

      - name: Verify installed wheel
        run: python check_green.py --gate package
